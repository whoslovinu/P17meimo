# REPARK site config (for /etc/nginx/sites-enabled/repark)
# This file MUST be included from the main nginx.conf via include sites-enabled/*;
# So it can only have http-level blocks (server, upstream, map). NOT user/worker/etc.

# Upstream: Next.js on port 3000 (loopback only — 3000 is NOT exposed publicly by UFW)
upstream repark_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Security headers — X-Frame-Options is now controlled by Next.js CSP frame-ancestors
    # (NEXT_PUBLIC_FRAME_ANCESTORS env var). Next.js emits the authoritative
    # frame-ancestors CSP directive; we strip Nginx's default X-Frame-Options here
    # so there is no conflict between the two headers.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Body size (banner / form uploads)
    client_max_body_size 10M;

    # Proxy everything to Next.js; strip Nginx's X-Frame-Options so Next.js
    # CSP frame-ancestors is the single source of truth for clickjacking protection.
    location / {
        proxy_pass http://repark_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        proxy_buffering off;
        proxy_redirect off;

        # Long timeouts for slow connections
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Cache static assets aggressively (Next.js _next/static)
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|ico|woff|woff2)$ {
        proxy_pass http://repark_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Health check via nginx (no upstream hit)
    location = /_nginx_health {
        return 200 'nginx ok\n';
        add_header Content-Type text/plain;
        add_header X-Frame-Options DENY always;
    }
}
